<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lichess Best Move</title>
<style>
body{font-family:sans-serif;background:#161512;color:#eee;max-width:480px;margin:auto;padding:16px}
input,button{width:100%;padding:12px;margin:6px 0;font-size:16px;border-radius:8px;border:0;box-sizing:border-box}
button{background:#629924;color:#fff}
#move{font-size:48px;text-align:center;margin:20px 0;font-weight:bold}
#info{text-align:center;color:#aaa}
small{color:#999}
</style></head><body>
<h2>Lichess Best Move</h2>
<small>For games vs the computer or friends who agreed. Never plays for you.</small>
<input id="token" type="password" placeholder="Lichess token (board:play)">
<button id="go">Start</button>
<div id="status">Idle</div>
<div id="move">-</div>
<div id="info"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const API = "https://lichess.org";
const $ = id => document.getElementById(id);
let engine, pendingResolve;

async function initEngine() {
  const url = "https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js";
  const code = await (await fetch(url)).text();
  engine = new Worker(URL.createObjectURL(new Blob([code], {type: "application/javascript"})));
  let lastScore = "";
  engine.onmessage = e => {
    const l = typeof e.data === "string" ? e.data : "";
    const m = l.match(/score (cp|mate) (-?\d+)/);
    if (m) lastScore = m[1] === "cp" ? (m[2] / 100).toFixed(2) : "mate " + m[2];
    if (l.startsWith("bestmove") && pendingResolve) {
      pendingResolve({move: l.split(" ")[1], score: lastScore});
      pendingResolve = null;
    }
  };
  engine.postMessage("uci");
}

function bestMove(fen) {
  return new Promise(res => {
    pendingResolve = res;
    engine.postMessage("stop");
    engine.postMessage("position fen " + fen);
    engine.postMessage("go movetime 1000");
  });
}

async function* ndjson(url, token) {
  const r = await fetch(url, {headers: {Authorization: "Bearer " + token}});
  if (!r.ok) throw new Error("Lichess error " + r.status);
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "";
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let i;
    while ((i = buf.indexOf("\n")) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (line) yield JSON.parse(line);
    }
  }
}

async function playGame(gid, myId, token) {
  let color, startFen = null;
  for await (const ev of ndjson(API + "/api/board/game/stream/" + gid, token)) {
    let state;
    if (ev.type === "gameFull") {
      color = ev.white.id === myId ? "w" : "b";
      if (ev.initialFen && ev.initialFen !== "startpos") startFen = ev.initialFen;
      state = ev.state;
      $("status").textContent = "Game " + gid + ": you are " + (color === "w" ? "White" : "Black");
    } else if (ev.type === "gameState") state = ev;
    else continue;
    if (state.status !== "started") { $("status").textContent = "Game ended: " + state.status; $("move").textContent = "-"; return; }
    const chess = startFen ? new Chess(startFen) : new Chess();
    for (const m of state.moves.split(" ").filter(Boolean))
      chess.move({from: m.slice(0, 2), to: m.slice(2, 4), promotion: m[4]});
    if (chess.turn() === color) {
      $("move").textContent = "...";
      const {move, score} = await bestMove(chess.fen());
      const mv = chess.move({from: move.slice(0, 2), to: move.slice(2, 4), promotion: move[4]});
      $("move").textContent = mv ? mv.san : move;
      $("info").textContent = move + "  |  eval (side to move): " + score;
    } else {
      $("move").textContent = "Opponent's turn";
      $("info").textContent = "";
    }
  }
}

$("go").onclick = async () => {
  const token = $("token").value.trim();
  if (!token) return alert("Enter your Lichess token");
  try {
    $("status").textContent = "Loading engine...";
    await initEngine();
    const me = await (await fetch(API + "/api/account", {headers: {Authorization: "Bearer " + token}})).json();
    $("status").textContent = "Waiting for a game to start on Lichess...";
      let current = null;
    while (true) {
      try {
        const d = await (await fetch(API + "/api/account/playing", {headers: {Authorization: "Bearer " + token}})).json();
        const g = d.nowPlaying && d.nowPlaying[0];
        if (g && g.gameId !== current) {
          current = g.gameId;
          playGame(g.gameId, me.id, token).catch(e => $("status").textContent = "Error: " + e.message);
        }
      } catch (e) {}
      await new Promise(r => setTimeout(r, 5000));
    }
  } catch (e) { $("status").textContent = "Error: " + e.message; }
};
</script></body></html>
