<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chess Practice</title>
<style>
body{font-family:sans-serif;background:#161512;color:#eee;max-width:480px;margin:auto;padding:16px}
select,button{padding:10px;font-size:15px;border-radius:8px;border:0}
button{background:#629924;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
#board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;width:100%}
.sq{display:flex;align-items:center;justify-content:center;font-size:min(10vw,44px);cursor:pointer;color:#000;padding:0;border-radius:0;aspect-ratio:1;line-height:1}
.l{background:#f0d9b5}.d{background:#b58863}
.sel{box-shadow:inset 0 0 0 4px #1565c0}.hint{box-shadow:inset 0 0 0 4px #2e7d32}
.w{color:#fff;text-shadow:0 0 2px #000,0 0 2px #000}
#status,#info{text-align:center;margin:8px 0}
</style></head><body>
<h2>Chess Practice vs Stockfish</h2>
<div class="row">
  <select id="color"><option value="w">White</option><option value="b">Black</option></select>
  <select id="level"><option value="1">Easy</option><option value="8" selected>Medium</option><option value="20">Hard</option></select>
  <button id="new">New game</button>
  <button id="hintBtn">Best move</button>
  <button id="undo">Undo</button>
</div>
<div id="status">Loading engine...</div>
<div id="board"></div>
<div id="info"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const GLYPH = {p:"♟",n:"♞",b:"♝",r:"♜",q:"♛",k:"♚"};
let engine, chess, me = "w", selected = null, hint = null, busy = true, gameNo = 0;
let queue = Promise.resolve();

async function initEngine() {
  const r = await fetch("https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js");
  if (!r.ok) throw new Error("Engine download failed: " + r.status);
  engine = new Worker(URL.createObjectURL(new Blob([await r.text()], {type: "application/javascript"})));
  engine.postMessage("uci");
}

// Ek waqt mein sirf ek search, taake jawab mix na hon
function search(fen, skill) {
  const job = queue.then(() => new Promise(res => {
    let score = "";
    engine.onmessage = e => {
      const l = String(e.data);
      const m = l.match(/score (cp|mate) (-?\d+)/);
      if (m) score = m[1] === "cp" ? (m[2] / 100).toFixed(2) : "mate " + m[2];
      if (l.startsWith("bestmove")) res({move: l.split(" ")[1], score});
    };
    engine.postMessage("setoption name Skill Level value " + skill);
    engine.postMessage("position fen " + fen);
    engine.postMessage("go movetime 800");
  }));
  queue = job;
  return job;
}

const parse = u => ({from: u.slice(0, 2), to: u.slice(2, 4), promotion: u[4]});

function render() {
  const b = $("board"); b.innerHTML = "";
  for (let i = 0; i < 64; i++) {
    const row = Math.floor(i / 8), col = i % 8;
    const f = me === "w" ? col : 7 - col, rank = me === "w" ? 8 - row : row + 1;
    const sq = "abcdefgh"[f] + rank, p = chess.get(sq);
    const el = document.createElement("div");
    el.className = "sq " + ((row + col) % 2 ? "d" : "l") + (p && p.color === "w" ? " w" : "") +
      (sq === selected ? " sel" : "") + (hint && (sq === hint.from || sq === hint.to) ? " hint" : "");
    el.textContent = p ? GLYPH[p.type] + "︎" : "";
    el.dataset.sq = sq;
    el.onclick = () => click(sq);
    b.appendChild(el);
  }
  $("status").textContent =
    chess.in_checkmate() ? (chess.turn() === me ? "Checkmate, you lost" : "Checkmate, you won!") :
    chess.game_over() ? "Draw" :
    chess.turn() === me ? "Your turn" + (chess.in_check() ? " (check)" : "") : "Computer is thinking...";
}

async function engineTurn() {
  if (chess.game_over()) { busy = false; return; }
  busy = true;
  const id = gameNo;
  const {move} = await search(chess.fen(), $("level").value);
  if (id !== gameNo) return;
  chess.move(parse(move));
  busy = false; render();
}

function click(sq) {
  if (busy || chess.game_over() || chess.turn() !== me) return;
  const p = chess.get(sq);
  if (p && p.color === me) { selected = sq; return render(); }
  if (!selected) return;
  const mv = chess.move({from: selected, to: sq, promotion: "q"});
  selected = null;
  if (mv) { hint = null; $("info").textContent = ""; }
  render();
  if (mv) engineTurn();
}

function newGame() {
  gameNo++; chess = new Chess(); me = $("color").value; selected = hint = null;
  $("info").textContent = ""; busy = false; render();
  if (me === "b") engineTurn();
}

$("new").onclick = () => { if (engine) newGame(); };
$("hintBtn").onclick = async () => {
  if (busy || chess.game_over()) return;
  busy = true; $("info").textContent = "Thinking...";
  const id = gameNo;
  const {move, score} = await search(chess.fen(), 20);
  if (id !== gameNo) return;
  hint = parse(move);
  const m = chess.move(hint); chess.undo();
  busy = false; render();
  $("info").textContent = "Best: " + m.san + "  |  eval: " + score;
};
$("undo").onclick = () => {
  if (busy || chess.history().length < (me === "w" ? 1 : 2)) return;
  chess.undo(); if (chess.turn() !== me) chess.undo();
  selected = hint = null; $("info").textContent = ""; render();
};

initEngine().then(newGame).catch(e => $("status").textContent = "Error: " + e.message);
</script></body></html>
